name: Bug Report
description: Report a bug in the Gemini plugin for Claude Code
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: "When I run /gemini:rescue, it..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run `/gemini:setup`
        2. Run `/gemini:rescue investigate ...`
        3. See error...
    validations:
      required: true

  - type: input
    id: gemini-version
    attributes:
      label: Gemini CLI Version
      description: Output of `gemini --version`
      placeholder: "0.38.2"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Output of `node --version`
      placeholder: "v22.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: auth-method
    attributes:
      label: Auth Method
      description: Which auth type is configured in your Gemini settings?
      options:
        - Google OAuth
        - Gemini API key
        - Google API key
        - Vertex AI
        - AI Gateway
        - Not sure
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any error messages or logs. This will be formatted as code automatically.
      render: shell
    validations:
      required: false
